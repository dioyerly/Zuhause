<!doctype html>
<html lang="es" data-theme="canela">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zuhause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   3 TEMAS (tomados de las imágenes de referencia)
   canela  · Pantone Cinnamon Stick + camel + crema + negro
   menta   · Menta + Bermellón (cinnabar) + vino
   borgona · Borgoña + Celeste (baby blue)
   ===================================================================== */
:root,[data-theme="canela"]{
  --bg:#F4EDE3; --bg-2:#ECE2D4; --panel:#FFFBF5; --panel-2:#F8F1E7; --line:#E5D8C6; --line-2:#D6C4AD;
  --ink:#2B1D16; --ink-2:#5A4537; --muted:#8A7464;
  --p:#9B4722; --p-2:#B5582F; --p-ink:#FFF6EC; --p-soft:#F3DCCB;
  --s:#C49A6C; --s-soft:#EFE2CF; --a:#1F1A17; --a-ink:#F4EDE3;
  --ok:#5E7A4A; --ok-bg:#E3EAD8; --warn:#C07A1E; --warn-bg:#F6E6C9; --bad:#A3361E; --bad-bg:#F5D9CF;
  --c1:#9B4722; --c2:#C49A6C; --c3:#1F1A17; --c4:#D98A5B; --c5:#7C8B6A; --c6:#B9A48C; --c7:#6B4E3F; --c8:#E3C9A8;
  --sky1:#F3E3CF; --sky2:#F9EFE2; --wall:#FFF7EC; --wall-2:#F6E7D3; --roof:#9B4722; --roof-2:#7E3818; --ground:#C9B08E; --leaf:#7C8B6A; --leaf-2:#5F6F4F; --window:#FBE6B2; --wood:#8A5A3B;
  --shadow:0 1px 2px rgba(43,29,22,.06),0 12px 30px -18px rgba(43,29,22,.35); --shadow-lg:0 30px 70px -24px rgba(43,29,22,.5);
}
[data-theme="menta"]{
  --bg:#F1F6F1; --bg-2:#E5EEE6; --panel:#FFFFFF; --panel-2:#F6FAF6; --line:#DAE6DC; --line-2:#C5D7C9;
  --ink:#251A1A; --ink-2:#4E3F3F; --muted:#6F7A72;
  --p:#B3202A; --p-2:#CB3640; --p-ink:#FFFFFF; --p-soft:#F8DBDD;
  --s:#8FBFA0; --s-soft:#DFEFE4; --a:#7A1A22; --a-ink:#FFF3F3;
  --ok:#3F8A5E; --ok-bg:#DDEFE3; --warn:#C98A1E; --warn-bg:#F8EBCF; --bad:#8E1A20; --bad-bg:#F5D6D8;
  --c1:#B3202A; --c2:#8FBFA0; --c3:#7A1A22; --c4:#4F8A68; --c5:#E07B6E; --c6:#BFD6C6; --c7:#2E5E44; --c8:#F2B8B3;
  --sky1:#DDEEE2; --sky2:#F1F8F2; --wall:#FFFFFF; --wall-2:#EEF5EF; --roof:#B3202A; --roof-2:#7A1A22; --ground:#A9CDB4; --leaf:#8FBFA0; --leaf-2:#4F8A68; --window:#FFF0C7; --wood:#7A1A22;
  --shadow:0 1px 2px rgba(37,26,26,.05),0 12px 30px -18px rgba(37,26,26,.3); --shadow-lg:0 30px 70px -24px rgba(37,26,26,.45);
}
[data-theme="borgona"]{
  --bg:#F1F4F8; --bg-2:#E4EAF2; --panel:#FFFFFF; --panel-2:#F6F8FB; --line:#DCE3ED; --line-2:#C7D2E0;
  --ink:#24131A; --ink-2:#4A3540; --muted:#6E6872;
  --p:#5C1A2E; --p-2:#7A2840; --p-ink:#FFFFFF; --p-soft:#EBD8DE;
  --s:#A9C4E2; --s-soft:#E3EDF7; --a:#2F4E73; --a-ink:#F1F4F8;
  --ok:#3F7D65; --ok-bg:#DCEEE6; --warn:#B8812F; --warn-bg:#F5EAD6; --bad:#A8323E; --bad-bg:#F5D9DC;
  --c1:#5C1A2E; --c2:#A9C4E2; --c3:#8E3B55; --c4:#5E86B3; --c5:#D6A3B2; --c6:#2F4E73; --c7:#C9D6E6; --c8:#B78A97;
  --sky1:#DCE8F5; --sky2:#F3F7FC; --wall:#FFFFFF; --wall-2:#EEF2F8; --roof:#5C1A2E; --roof-2:#3E0F1E; --ground:#C9D6E6; --leaf:#8FAFC9; --leaf-2:#5E86B3; --window:#FFF1D2; --wood:#5C1A2E;
  --shadow:0 1px 2px rgba(36,19,26,.05),0 12px 30px -18px rgba(36,19,26,.3); --shadow-lg:0 30px 70px -24px rgba(36,19,26,.45);
}
:root{ --r:20px; --head:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .5s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11px} .right{text-align:right} .nowrap{white-space:nowrap} .num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.neg{color:var(--bad)} .posv{color:var(--ok)}

/* ================= BARRA SUPERIOR ================= */
.topbar{position:sticky;top:0;z-index:40;padding:12px 22px;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.home-btn{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0;flex:none}
.home-btn .mk{width:40px;height:40px;border-radius:14px;background:var(--p);color:var(--p-ink);display:grid;place-items:center;box-shadow:0 10px 20px -10px var(--p);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.home-btn:hover .mk{transform:rotate(-8deg) scale(1.06)}
.home-btn .mk svg{width:21px;height:21px}
.home-btn b{font-family:var(--head);font-size:17px;display:block;line-height:1.1;text-align:left}
.home-btn span{font-size:11px;color:var(--muted);display:block;text-align:left}
.phrase{flex:1;max-width:620px;margin:0 auto;position:relative}
.phrase input{width:100%;padding:12px 16px 12px 46px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--panel);outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
.phrase input:focus{border-color:var(--p);box-shadow:0 0 0 5px color-mix(in srgb,var(--p) 14%,transparent)}
.phrase .spark{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--p);width:20px;height:20px}
.phrase-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:14px;z-index:60;animation:pop .2s ease}
.phrase-pop .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ex{border:1px dashed var(--line-2);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.ex:hover{border-color:var(--p);color:var(--p)}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.avatars{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2.5px solid var(--panel);margin-left:-8px;background:var(--s-soft);cursor:pointer;transition:transform .2s;flex:none;font-weight:700;font-size:13px;color:var(--ink)}
.av:first-child{margin-left:0}
.av:hover{transform:translateY(-3px) scale(1.08);z-index:2}
.av.big{width:46px;height:46px;font-size:22px;margin:0;border-width:3px}
.theme-sw{display:flex;gap:5px;padding:5px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.theme-sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .2s}
.theme-sw button.on{border-color:var(--ink);transform:scale(1.1)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--bg-2)} .icon-btn:active{transform:scale(.93)} .icon-btn svg{width:17px;height:17px}

/* ================= PLANO DE HABITACIONES (navegación) ================= */
.floorplan{display:flex;gap:6px;padding:8px 22px 4px;overflow-x:auto;scrollbar-width:none;max-width:1440px;margin:0 auto}
.floorplan a{flex:none;display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:14px 14px 14px 4px;text-decoration:none;font-weight:600;font-size:13px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);position:relative;transition:transform .2s,background .2s,color .2s}
.floorplan a:hover{transform:translateY(-2px)}
.floorplan a .ri{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--s-soft);color:var(--p)}
.floorplan a .ri svg{width:15px;height:15px}
.floorplan a.active{background:var(--p);color:var(--p-ink);border-color:transparent}
.floorplan a.active .ri{background:rgba(255,255,255,.18);color:var(--p-ink)}
.floorplan a .bd{position:absolute;top:-6px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-weight:700;box-shadow:0 0 0 2px var(--bg)}

/* ================= PÁGINA ================= */
.view{padding:14px 22px 110px;max-width:1440px;margin:0 auto}
.page{animation:pageIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.room-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:6px 0 18px;flex-wrap:wrap}
.room-head .crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.room-head .crumb a{text-decoration:none;font-weight:600}
.room-head h1{font-size:34px;line-height:1.05;display:flex;align-items:center;gap:12px}
.room-head h1 .ri{width:46px;height:46px;border-radius:16px;background:var(--p-soft);color:var(--p);display:grid;place-items:center}
.room-head h1 .ri svg{width:24px;height:24px}
.room-head p{margin:6px 0 0;color:var(--muted);max-width:620px}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.month-nav button{border:0;background:none;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:17px}
.month-nav button:hover{background:var(--bg-2)}
.month-nav b{min-width:128px;text-align:center;font-family:var(--head);text-transform:capitalize}

/* ================= CASA (home) ================= */
.home{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.house-card{background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);border-radius:28px;border:1px solid var(--line);padding:10px 10px 0;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.house svg{width:100%;height:auto;display:block}
.house .room{cursor:pointer}
.house .room .bgr{fill:var(--wall);transition:fill .3s}
.house .room:hover .bgr,.house .room:focus .bgr{fill:var(--p-soft)}
.house .room:focus{outline:none}
.house .room .lbl{font-family:var(--head);font-size:17px;font-weight:600;fill:var(--ink)}
.house .room .st{font-family:var(--sans);font-size:11.5px;fill:var(--muted);font-weight:600}
.house .room .ico{stroke:var(--p);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.house .room .win{fill:var(--window);transition:opacity .4s}
.house .room.lit .win{animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.house .badge-c{fill:var(--bad)} .house .badge-c.ok{fill:var(--ok)} .house .badge-c.warn{fill:var(--warn)}
.house .badge-t{fill:#fff;font-size:11px;font-weight:800;font-family:var(--sans)}
.house .roof{fill:var(--roof)} .house .roof-2{fill:var(--roof-2)}
.house .smoke circle{fill:var(--wall);opacity:.0;animation:smoke 6s ease-in infinite}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.8}100%{opacity:0;transform:translate(26px,-90px) scale(1.8)}}
.house .tree{transform-origin:85px 600px;animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.house .cloud{fill:#fff;opacity:.8;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
.house .fruit{animation:fruitIn .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fruitIn{from{transform:scale(0)}}
.hoy{display:flex;flex-direction:column;gap:14px}

/* ================= TARJETAS ================= */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0;position:relative;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:18px}
.stat .lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--head);font-size:30px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-word}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.hero{background:var(--p);color:var(--p-ink);border-color:transparent}
.stat.hero .lbl,.stat.hero .sub{color:color-mix(in srgb,var(--p-ink) 75%,transparent)}
.stat.hero::after{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 65%);animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translate(-16px,14px) scale(1.1)}}
.stat.soft{background:var(--s-soft);border-color:transparent}
.info-i{width:16px;height:16px;border-radius:50%;border:1px solid currentColor;display:inline-grid;place-items:center;font-size:10px;font-weight:800;cursor:help;opacity:.6;background:none;padding:0;color:inherit;font-family:var(--head);font-style:italic;flex:none}
.tip{position:fixed;z-index:400;max-width:290px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow-lg);pointer-events:none;animation:pop .15s ease}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.p{background:var(--p-soft);color:var(--p)} .badge.s{background:var(--s-soft);color:var(--ink-2)}

/* ================= BOTONES / FORMULARIOS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer;font-size:13.5px;white-space:nowrap;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s;position:relative;overflow:hidden;text-decoration:none}
.btn:hover{border-color:var(--p);transform:translateY(-1px)} .btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--p);color:var(--p-ink);border-color:transparent;box-shadow:0 10px 22px -12px var(--p)}
.btn-primary:hover{border-color:transparent;background:var(--p-2)}
.btn-lens{background:var(--a);color:var(--a-ink);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent} .btn-ghost:hover{background:var(--bg-2);border-color:transparent}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .btn-danger.solid{background:var(--bad);color:#fff;border-color:transparent}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .6s linear;background:rgba(255,255,255,.4);pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl-sm{font-size:12px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--muted)}
.input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
textarea.input{resize:vertical;min-height:64px}
.input:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 14%,transparent)}
.input.invalid{border-color:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 14%,transparent)}
.input.sm{padding:7px 10px;font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.form-sec{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px dashed var(--line-2);padding-top:12px;margin-top:4px}
.err-msg{color:var(--bad);font-size:12.5px;font-weight:700}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .25s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked{background:var(--p)} .switch input:checked::after{transform:translateX(17px)}
.check{display:flex;gap:9px;align-items:center;cursor:pointer}
.check input{accent-color:var(--p);width:17px;height:17px}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.pickchips label{cursor:pointer} .pickchips input{display:none}
.pickchips span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:700;transition:all .2s;background:var(--panel)}
.pickchips input:checked + span{background:var(--p);color:var(--p-ink);border-color:transparent}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap;font-size:13.5px}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--p);animation:grow .3s ease}
@keyframes grow{from{transform:scaleX(0)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.listedit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.listedit .badge{padding:5px 5px 5px 11px;font-size:12.5px}
.listedit .badge button{border:0;background:rgba(0,0,0,.08);width:19px;height:19px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:12px;line-height:1;color:inherit}
.addrow{display:flex;gap:8px} .addrow .input{flex:1}

/* ================= TABLAS / LISTAS ================= */

'use strict';
/* =====================================================================
   ZUHAUSE — organizador familiar (archivo único, listo para PHP)
   ---------------------------------------------------------------------
   MODO LOCAL: los datos quedan en este navegador (IndexedDB).
   MODO PHP:   definí antes de este script  window.FAMILIA_API = 'api.php'

                 GET  api.php?action=load   → {version, data}
                 POST api.php?action=save   {version, data} → {version}
                 POST api.php?action=login  {password}

   Cada colección del estado (members, expenses, tasks…) es una lista de

const $ = (s, r = document) => r.querySelector(s);

const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).trim().replace(',', '.')); return Number.isFinite(n) ? n : null; };

const addMonths = (s, n) => { const d = parseD(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return fmtDate(d); };

/* ---------- toasts ---------- */
function toast(msg, tone = 'ok') {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast ' + tone; t.setAttribute('role', 'status');
  t.innerHTML = `<span class="tdot"></span><span>${esc(msg)}</span>`;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, tone === 'bad' ? 5200 : 3000);
}

/* ---------- tooltips ---------- */
let tipEl = null;
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]'); if (!el) return;
  tipEl?.remove(); tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.textContent = el.dataset.tip; document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2));
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) { tipEl?.remove(); tipEl = null; } });
document.addEventListener('click', e => { const el = e.target.closest('.info-i'); if (el) { e.preventDefault(); e.stopPropagation(); toast(el.dataset.tip, 'ok'); } }, true);

/* ---------- ripple en botones ---------- */

    <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  document.body.appendChild(ov);

    close() { if (m.closed) return; m.closed = true; ov.classList.add('closing'); const i = modalStack.indexOf(m); if (i >= 0) modalStack.splice(i, 1); setTimeout(() => ov.remove(), 200); onClose && onClose(); },

function formData(form) {

/* ---------- imágenes (se comprimen antes de guardar) ---------- */
function compressImage(file, max = 900, q = .78) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('El archivo no es una imagen'));
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q));
    }; img.onerror = () => rej(new Error('No se pudo leer la imagen')); img.src = fr.result; };
    fr.onerror = () => rej(fr.error); fr.readAsDataURL(file);
  });
}

    tip.innerHTML = `<div style="opacity:.75;margin-bottom:3px">${esc(labels[i].long)}</div>` + series.map(s => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${esc(s.name)}: <b>${esc(fmt(s.values[i]))}</b></div>`).join('');

/* Cascada de resultados */
function waterfall(el, steps) {

  const vals = bars.flatMap(b => [b.a, b.b]); const mx = Math.max(0, ...vals), mn = Math.min(0, ...vals); const span = (mx - mn) || 1;
  const y = v => pt + (mx - v) / span * ih; const bw = iw / bars.length;
  let g = `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)"/>`;
  bars.forEach((b, i) => {
    const top = y(Math.max(b.a, b.b)), h = Math.max(2, Math.abs(y(b.a) - y(b.b))), xx = pl + i * bw + bw * .16, w = bw * .68;
    const col = b.kind === 'total' ? (b.value >= 0 ? 'var(--c1)' : 'var(--bad)') : (b.value >= 0 ? 'var(--c4)' : 'var(--c5)');
    g += `<rect x="${xx}" y="${top}" width="${w}" height="${h}" rx="6" fill="${col}" style="transform-origin:${xx + w / 2}px ${y(0)}px;animation:wfIn .7s ${i * .08}s cubic-bezier(.2,.8,.2,1) both"><title>${esc(b.label)}: ${esc(money(b.value))}</title></rect>`;
    g += `<text x="${xx + w / 2}" y="${top - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--sans)">${esc(moneyShort(b.value))}</text>`;
    g += `<foreignObject x="${pl + i * bw}" y="${H - pb + 6}" width="${bw}" height="${pb}"><div xmlns="http://www.w3.org/1999/xhtml" style="font:11px/1.2 var(--sans);color:var(--muted);text-align:center;padding:0 2px">${esc(b.label)}</div></foreignObject>`;
  });

/* Contadores animados */
function countUp(root = document) {

    const to = Number(el.dataset.count), kind = el.dataset.kind; const t0 = performance.now(), dur = 900;
    const f = v => kind === 'money' ? money(v) : fnum(v);

    const tick = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(kind === 'money' ? to * e : Math.round(to * e)); if (k < 1) requestAnimationFrame(tick); else el.textContent = f(to); };

/* Barras agrupadas verticales (p. ej. ingresos vs gastos por mes, ganadas vs perdidas) */
function groupBars(el, { labels, series, fmt = v => v, height = 220, signed = false }) {
  if (!el) return;
  const W = Math.max(280, el.clientWidth), H = height, pl = 50, pr = 8, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb, n = labels.length, k = series.length;

  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 56))));
  labels.forEach((l, i) => { if (i % step === 0) ax += `<text x="${pl + gw * i + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(l.short)}</text>`; });

  labels.forEach((l, i) => series.forEach((s, j) => { let v = s.values[i]; if (signed && s.neg) v = -v; const x = pl + gw * i + (gw - bw * k) / 2 + j * bw, top = y(Math.max(0, v)), h = Math.max(v ? 2 : 0, Math.abs(y(v) - y(0)));

  const m = openModal({ title: ev ? 'Editar evento' : 'Nuevo evento', body: `<form id="evF" class="form-grid">${field('¿Qué? *', `<input class="input" name="title" value="${esc(v.title || '')}" autofocus placeholder="Turno pediatra, acto del colegio…">`, 'full')}${field('Fecha *', `<input class="input" type="date" name="date" value="${v.date}">`)}${field('Hora', `<input class="input" type="time" name="time" value="${v.time || ''}">`)}${field('Tipo', `<select class="input" name="type">${opts(EVENT_TYPES, v.type)}</select>`)}${field('Lugar', `<input class="input" name="place" value="${esc(v.place || '')}">`)}<div class="field full"><label>¿Quiénes?</label><div class="pickchips" id="evWho">${state.members.map(x => `<label><input type="checkbox" value="${x.id}" ${(v.memberIds || []).includes(x.id) ? 'checked' : ''}><span>${x.emoji || ''} ${esc(x.name)}</span></label>`).join('')}</div></div>${field('Notas', `<input class="input" name="note" value="${esc(v.note || '')}">`, 'full')}</form>`, footer: `${ev ? `<button class="btn btn-danger" data-del style="margin-right:auto">${ic('trash')}</button>` : ''}<button class="btn btn-primary" data-save>Guardar</button>` });
  m.el.querySelector('[data-del]')?.addEventListener('click', async () => { try { await transact('evento', st => { st.events = st.events.filter(x => x.id !== ev.id); }); m.close(); rerender(); } catch (e) { } });
  m.el.querySelector('[data-save]').onclick = async () => { const f = $('#evF', m.el), d = formData(f), bad = ['title', 'date'].filter(k => !d[k]); markInvalid(f, bad); if (bad.length) return; const who = $$('#evWho input:checked', m.el).map(i => i.value); try { await transact('evento', st => { const rec = { ...d, memberIds: who }; if (ev) Object.assign(st.events.find(x => x.id === ev.id), rec); else st.events.push({ id: uid('ev'), ...rec }); }); toast('Agendado'); m.close(); rerender(); } catch (e) { } };
}

  const f = $('#mbF', m.el), kidVis = () => $$('.kid-only', m.el).forEach(x => x.classList.toggle('hidden', f.role.value !== 'nino')); f.role.onchange = kidVis; kidVis();

async function cfgSave(fn, quiet) { try { await transact('cfg', st => { fn(st); logAct(st, 'Ajustes', ''); }); if (!quiet) toast('Guardado'); const y = window.scrollY; render(); window.scrollTo(0, y); } catch (e) { } }

ACT.rmCat = async el => { const id = el.dataset.id, used = state.expenses.some(e => e.categoryId === id) || state.bills.some(b => b.categoryId === id); if (!(await confirmDialog({ title: 'Quitar categoría', message: used ? 'Tiene gastos o cuentas: pasarán a “Otros”.' : '¿Quitar esta categoría?', ok: 'Quitar', tone: 'danger' }))) return; cfgSave(st => { st.settings.categories = st.settings.categories.filter(c => c.id !== id); st.expenses.forEach(e => { if (e.categoryId === id) e.categoryId = 'otros'; }); st.bills.forEach(b => { if (b.categoryId === id) b.categoryId = 'otros'; }); delete st.settings.budgets[id]; }); };

ACT.saveSplit = () => { const d = formData($('#f-split')), vals = Object.entries(d).map(([k, v]) => [k, num(v) || 0]); const tot = sum(vals, x => x[1]); if (Math.abs(tot - 100) > .5) { toast(`Suma ${fnum(tot, 1)}%: tiene que dar 100%`, 'bad'); return; } cfgSave(st => { st.settings.split = Object.fromEntries(vals); }); };

async function restoreBackup(e) { const f = e.target.files[0]; e.target.value = ''; if (!f) return; let d; try { d = JSON.parse(await f.text()); } catch (er) { toast('Archivo inválido', 'bad'); return; } if (!d || d.version !== 1 || !d.settings || !Array.isArray(d.members)) { toast('No es un respaldo de esta app', 'bad'); return; } if (!(await confirmDialog({ title: 'Restaurar respaldo', message: 'Se reemplazan todos los datos actuales.', ok: 'Reemplazar', tone: 'danger' }))) return; try { await transact('restore', () => { state = normalizeState(d); logAct(state, 'Respaldo restaurado', f.name); }); unlocked = !state.settings.pin; $('#root').innerHTML = ''; render(); toast('Restaurado'); } catch (er) { } }
ACT.wipe = async () => { const r = await confirmDialog({ title: 'Borrar todo', message: 'Se eliminan todos los datos de la casa. Escribí BORRAR.', ok: 'Borrar', tone: 'danger', extra: '<input class="input" name="c" autocomplete="off">' }); if (!r || r.c !== 'BORRAR') { if (r) toast('No se borró nada', 'bad'); return; } const th = state.settings.theme; state = emptyState(); state.settings.theme = th; try { await DataStore.save(state); } catch (e) { } $('#root').innerHTML = ''; render(); };

(async function boot() {
  try { await bootLoad(); } catch (e) { if (e.auth) needLogin = true; else if (e.blocked) isBlocked = true; else { console.error(e); toast('No se pudieron cargar los datos: ' + (e.userMsg || e.message), 'bad'); } }
  if (!state.settings.pin) unlocked = true;
  if (ui.who && !member(ui.who)) ui.who = '';
  const r = location.hash.replace('#/', ''); if (r && VIEWS[r]) ui.route = r;
  render();
})();
</script></body></html>
